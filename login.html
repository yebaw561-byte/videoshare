<!DOCTYPE html>
<html lang="my">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Login</title>

  <link rel="stylesheet" href="style.css">

</head>


<body class="login-page">


<div class="login-box">

  <div class="login-logo">
    PharGaung
  </div>

  <h2>
    PharGaung Login
  </h2>

  <p>
    Admin Account ဖြင့်ဝင်ပါ
  </p>


  <input
    type="email"
    id="adminEmail"
    placeholder="Admin Gmail"
  >


  <input
    type="password"
    id="adminPassword"
    placeholder="Password"
  >


  <button onclick="adminLogin()">
    Login
  </button>


  <div
    id="loginError"
    class="login-error"
  ></div>


  <a href="index.html">
    ← Back to Website
  </a>

</div>


<script src="script.js"></script>

</body>
</html>
